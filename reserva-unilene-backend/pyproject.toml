[project]
name = "reserva-unilene-backend"
version = "0.1.0"
description = "FastAPI backend for UNILENE seat reservations"
readme = "README.md"
authors = [
    { name = "Gerson Salas", email = "gersonsalas@unilene.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "mssql-python>=1.16.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
